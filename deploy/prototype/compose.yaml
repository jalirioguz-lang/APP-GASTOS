name: aldia-prototype

services:
  auth:
    image: python:3.12-slim-bookworm
    restart: unless-stopped
    command: ["python", "-u", "/srv/auth/serve_prototype_login.py"]
    env_file:
      - .env
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ../../execution/serve_prototype_login.py:/srv/auth/serve_prototype_login.py:ro
      - ../../apps/prototype:/srv/prototype:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.5

  web:
    image: caddy:2.10.2
    restart: unless-stopped
    depends_on:
      - auth
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5

volumes:
  caddy_data:
  caddy_config:
